# TODO: Update meta.url, meta.repoUrl, and meta.siteName with your production domain and identity
meta:
  siteName:
    en: wowkfccc
    zh-TW: wow肯德基爺爺欸
  title:
    en: wowkfccc — Student Software Engineer form FJU
    zh-TW: wow肯德基爺爺欸 — 學生開發者
  description:
    en: Software engineer from FJU Medical Informatics and Innovative Applications, trying to do some contribution to society.
    zh-TW: 來自輔大醫資學程的學生開發者，也許我的專案會對社會有幫助。
  url: https://charlene-hsu.github.io
  repoUrl: https://github.com/Charlene-HSU/charlene-hsu.github.io

nav:
  - id: about
    icon: User
    label:
      en: About
      zh-TW: 關於我
    description:
      en: Who I am, maybe someone welling to know.
      zh-TW: 我是誰，也許有人想知道呢。
  - id: skills
    icon: Braces
    label:
      en: Skills
      zh-TW: 技能
    description:
      en: Languages, frameworks and tools I work with.
      zh-TW: 我常用的程式語言、框架與工具。
  - id: experience
    icon: Briefcase
    label:
      en: Experience
      zh-TW: 經歷
    description:
      en: Where I have studied.
      zh-TW: 我的學習經歷。
  - id: projects
    icon: FolderGit2
    label:
      en: Projects
      zh-TW: 專案
    description:
      en: Things I have built, with links and notes.
      zh-TW: 我做過的專案、連結與筆記。
  - id: blog
    icon: PenLine
    label:
      en: Blog
      zh-TW: 部落格
    description:
      en: where I talk to myself
      zh-TW: 自言自語的地方。
  - id: friends
    icon: Users
    label:
      en: Friends
      zh-TW: 友站
    description:
      en: Friends' website.
      zh-TW: 朋友(電神)們的網站。
  - id: contact
    icon: Mail
    label:
      en: Contact
      zh-TW: 聯絡
    description:
      en: How to reach me.
      zh-TW: 聯絡我的方式。

blogTags:
  meta:
    en: Site news
    zh-TW: 網站消息
  frontend:
    en: Frontend
    zh-TW: 前端
  test:
    en: Test
    zh-TW: 測試

# Footer: which pages it lists, how many columns, and the link at the bottom right.
footer:
  # Page ids from `nav`, in the order they appear.
  links:
    - about
    - skills
    - experience
    - projects
    - blog
    - friends
    - contact
  # Number of columns for the links (1–4). Phones show at most 2.
  columns: 3
  # Bottom-right link. Use `page` (an id from `nav`) or `url` (https:// or mailto:).
  bottomLink:
    page: contact
    label:
      en: Contact me
      zh-TW: 聯絡我

# Home page shortcuts under the marquee: projects and posts updated in the last
# `recentDays` days, plus anything marked `pinned: true` (in projects.yaml or a
# post's front matter). Hidden when there is nothing to show.
shortcuts:
  recentDays: 30
  limit: 4
  # Self-introduction (md/about.<lang>.md) under your name on the home page. `false` hides it.
  about: true

embedAllowlist: []

